[package]
name = "yun-flow"
version = "0.1.0"
edition = "2021"
description = "Universal Reactive A2UI (Agent-to-UI) Protocol for Distributed Systems"
license = "Apache-2.0"
repository = "https://github.com/csh0101/yun-flow"
keywords = ["a2ui", "agent", "protocol", "reactive", "json-rpc"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
serde_json = "1.0"
